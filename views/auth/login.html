<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Masuk ke Sistem Inventaris Gudang UD Citra Perdana untuk mengelola stok, transaksi barang masuk, barang keluar, dan laporan logistik secara aman.">
    <title>Login - Citra Perdana</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-logo">
            <img src="../../assets/images/Logo Citra Perdana.png" alt="Logo UD Citra Perdana" style="max-width: 80px; height: auto;">
        </div>
        
        <div class="login-header">
            <h1>Citra Perdana</h1>
            <p>Silakan masuk ke sistem inventaris</p>
        </div>

        <form class="login-form" id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <i class="fas fa-user icon-left"></i>
                    <input type="text" id="username" name="username" placeholder="Masukkan username" required autocomplete="username">
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock icon-left"></i>
                    <input type="password" id="password" name="password" placeholder="Masukkan password" required autocomplete="current-password">
                    <i class="fas fa-eye toggle-password" id="togglePassword" title="Tampilkan Password"></i>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-full" style="margin-top: 15px;">
                Masuk
            </button>
        </form>
    </div>

    <script src="../../assets/js/script.js?v=12"></script>

</body>
</html>
